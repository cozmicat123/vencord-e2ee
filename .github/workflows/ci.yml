name: CI
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: '12.15.0' }
      - name: Run crypto vector tests
        run: npm ci && node tests/run.mjs
      - name: Checkout Vencord & VDE plugins
        run: |
          git clone https://github.com/Vendicated/Vencord.git /tmp/Vencord
          git -C /tmp/Vencord checkout a846785482f96c50f1160a04217e1e90283d2ec1
          git clone --recursive https://git.nin0.dev/VendroidEnhanced/plugin.git /tmp/vde-plugin
          git -C /tmp/vde-plugin checkout 3741bd8c7e19b3940cf3709271115bfc6d48c853
          git -C /tmp/vde-plugin submodule update --init --recursive
      - name: Install deps, typecheck plugin & build VDE web bundle
        working-directory: /tmp/Vencord
        run: |
          mkdir -p src/userplugins
          cp -r "$GITHUB_WORKSPACE/src/userplugins/aegiresE2EE" src/userplugins/
          pnpm install --no-frozen-lockfile
          pnpm add -w hash-wasm@4.13.0 @noble/ciphers@2.4.0
          pnpm test:ts
          cp -r /tmp/vde-plugin/plugins/* src/plugins/
          node -e 'const fs=require("fs"),p=require("path");for(const l of fs.readFileSync("/tmp/vde-plugin/blacklisted-plugins.txt","utf8").split("\n")){const n=l.split("#")[0].trim();if(n)fs.rmSync(p.join("src/plugins",n),{recursive:true,force:true});}'
          pnpm buildWeb
          (cd dist && sha256sum browser.js browser.css Vencord.user.js extension-chrome.zip extension-firefox.zip > SHA256SUMS.txt)
          ls -lh dist/browser.js dist/browser.css dist/extension-chrome.zip dist/extension-firefox.zip dist/Vencord.user.js dist/SHA256SUMS.txt
      - name: Publish VDE bundle to builds branch
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/builds-pub && mkdir -p /tmp/builds-pub
          cp /tmp/Vencord/dist/browser.js /tmp/Vencord/dist/browser.css /tmp/Vencord/dist/browser.js.LEGAL.txt /tmp/Vencord/dist/Vencord.user.js /tmp/builds-pub/
          cd /tmp/builds-pub
          git init -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
      - name: Publish GitHub Release (nightly rolling or v* tag)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST=/tmp/Vencord/dist
          ASSETS=(
            "$DIST/browser.js"
            "$DIST/browser.css"
            "$DIST/browser.js.LEGAL.txt"
            "$DIST/Vencord.user.js"
            "$DIST/extension-chrome.zip"
            "$DIST/extension-firefox.zip"
            "$DIST/SHA256SUMS.txt"
          )
          cat <<NOTES > /tmp/release-notes.md
          Built from \`${GITHUB_REF_NAME}@${GITHUB_SHA::7}\` (Vencord \`a846785\` + VendroidEnhanced plugins \`3741bd8\`).

          ### Quick Install
          - **VendroidEnhanced** (*Developer settings → Vencord location*):
            \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/browser.js\`
          - **Chromium / Mobile Chromium**: \`extension-chrome.zip\`
          - **Firefox**: \`extension-firefox.zip\`
          - **Userscript (Violentmonkey / Tampermonkey)**: \`Vencord.user.js\`

          ### SHA-256
          \`\`\`
          $(cat "$DIST/SHA256SUMS.txt")
          \`\`\`
          NOTES

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
            else
              gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file /tmp/release-notes.md
            fi
          elif [ "${GITHUB_REF}" = "refs/heads/dev" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git tag -f nightly "$GITHUB_SHA"
            git push -f origin refs/tags/nightly
            TITLE="Nightly (${GITHUB_REF_NAME}@${GITHUB_SHA::7})"
            if gh release view nightly >/dev/null 2>&1; then
              gh release upload nightly "${ASSETS[@]}" --clobber
              gh release edit nightly --title "$TITLE" --notes-file /tmp/release-notes.md --prerelease
            else
              gh release create nightly "${ASSETS[@]}" --title "$TITLE" --notes-file /tmp/release-notes.md --prerelease
            fi
          fi
