name: CI
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  VENCORD_SHA: a846785482f96c50f1160a04217e1e90283d2ec1
  VDE_PLUGIN_SHA: 3741bd8c7e19b3940cf3709271115bfc6d48c853
  HASH_WASM_VER: 4.13.0
  NOBLE_CIPHERS_VER: 2.4.0

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: '12.15.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Run crypto vector tests
        run: npm ci && node tests/run.mjs
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-vde-${{ env.VENCORD_SHA }}-${{ env.HASH_WASM_VER }}-${{ env.NOBLE_CIPHERS_VER }}
          restore-keys: |
            ${{ runner.os }}-pnpm-vde-${{ env.VENCORD_SHA }}-
            ${{ runner.os }}-pnpm-vde-
      - name: Shallow-fetch Vencord & VDE plugins in parallel
        run: |
          (
            git init /tmp/Vencord
            git -C /tmp/Vencord remote add origin https://github.com/Vendicated/Vencord.git
            git -C /tmp/Vencord fetch --depth 1 origin "$VENCORD_SHA" || git -C /tmp/Vencord fetch origin
            git -C /tmp/Vencord checkout --detach "$VENCORD_SHA"
          ) &
          PID1=$!
          (
            git init /tmp/vde-plugin
            git -C /tmp/vde-plugin remote add origin https://git.nin0.dev/VendroidEnhanced/plugin.git
            git -C /tmp/vde-plugin fetch --depth 1 origin "$VDE_PLUGIN_SHA" || git -C /tmp/vde-plugin fetch origin
            git -C /tmp/vde-plugin checkout --detach "$VDE_PLUGIN_SHA"
            git -C /tmp/vde-plugin submodule update --init --recursive --depth 1 || git -C /tmp/vde-plugin submodule update --init --recursive
          ) &
          PID2=$!
          wait "$PID1" "$PID2"
      - name: Install deps, typecheck & build clean Vencord + VDE bundles
        working-directory: /tmp/Vencord
        run: |
          mkdir -p src/userplugins /tmp/out-clean /tmp/out-vde /tmp/release-dist
          cp -r "$GITHUB_WORKSPACE/src/userplugins/aegiresE2EE" src/userplugins/
          pnpm install --no-frozen-lockfile --prefer-offline
          pnpm add -w "hash-wasm@${HASH_WASM_VER}" "@noble/ciphers@${NOBLE_CIPHERS_VER}"
          pnpm test:ts

          # 1. Clean standard Vencord (Chrome/Titanium, Firefox, Userscript)
          pnpm buildWeb
          cp dist/extension-chrome.zip dist/extension-firefox.zip dist/Vencord.user.js /tmp/out-clean/

          # 2. VendroidEnhanced bundle (VDE plugins + VDE blacklist)
          cp -r /tmp/vde-plugin/plugins/* src/plugins/
          node -e 'const fs=require("fs"),p=require("path");for(const l of fs.readFileSync("/tmp/vde-plugin/blacklisted-plugins.txt","utf8").split("\n")){const n=l.split("#")[0].trim();if(n)fs.rmSync(p.join("src/plugins",n),{recursive:true,force:true});}'
          rm -rf dist
          pnpm buildWeb
          cp dist/browser.js /tmp/out-vde/vendroid-browser.js
          cp dist/browser.css /tmp/out-vde/vendroid-browser.css
          cp dist/browser.js.LEGAL.txt /tmp/out-vde/vendroid-browser.js.LEGAL.txt

          cp /tmp/out-clean/* /tmp/out-vde/* /tmp/release-dist/
          (cd /tmp/release-dist && sha256sum extension-chrome.zip extension-firefox.zip Vencord.user.js vendroid-browser.js vendroid-browser.css > SHA256SUMS.txt)
          ls -lh /tmp/release-dist/
      - name: Sign Firefox extension via AMO (unlisted, v* tags only)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO secrets not set; skipping Firefox signing."
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          rm -rf /tmp/ff-src /tmp/ff-signed && mkdir -p /tmp/ff-src /tmp/ff-signed
          unzip -q /tmp/release-dist/extension-firefox.zip -d /tmp/ff-src
          VER="$VER" node -e '
            const fs = require("fs");
            const p = "/tmp/ff-src/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.version = process.env.VER;
            m.browser_specific_settings = m.browser_specific_settings || {};
            m.browser_specific_settings.gecko = m.browser_specific_settings.gecko || {};
            m.browser_specific_settings.gecko.id = "vencord-e2ee@cozmicat123.github.io";
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          '
          npx --yes web-ext sign --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --source-dir=/tmp/ff-src \
            --artifacts-dir=/tmp/ff-signed
          XPI=$(ls /tmp/ff-signed/*.xpi | head -n 1)
          cp "$XPI" /tmp/release-dist/vencord-e2ee-firefox-signed.xpi
          (cd /tmp/release-dist && sha256sum vencord-e2ee-firefox-signed.xpi >> SHA256SUMS.txt)
      - name: Publish rolling URLs to builds branch
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/builds-pub && mkdir -p /tmp/builds-pub
          cp /tmp/out-vde/vendroid-browser.js /tmp/builds-pub/browser.js
          cp /tmp/out-vde/vendroid-browser.css /tmp/builds-pub/browser.css
          cp /tmp/out-vde/vendroid-browser.js.LEGAL.txt /tmp/builds-pub/browser.js.LEGAL.txt
          cp /tmp/out-clean/Vencord.user.js /tmp/builds-pub/Vencord.user.js
          cd /tmp/builds-pub
          git init -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
      - name: Publish GitHub Release (nightly rolling or v* tag)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST=/tmp/release-dist
          ASSETS=(
            "$DIST/extension-chrome.zip"
            "$DIST/extension-firefox.zip"
            "$DIST/Vencord.user.js"
            "$DIST/vendroid-browser.js"
            "$DIST/vendroid-browser.css"
            "$DIST/vendroid-browser.js.LEGAL.txt"
            "$DIST/SHA256SUMS.txt"
          )
          if [ -f "$DIST/vencord-e2ee-firefox-signed.xpi" ]; then
            ASSETS+=("$DIST/vencord-e2ee-firefox-signed.xpi")
          fi
          cat <<NOTES > /tmp/release-notes.md
          Built from \`${GITHUB_REF_NAME}@${GITHUB_SHA::7}\` (Vencord \`${VENCORD_SHA::7}\`; VendroidEnhanced plugins \`${VDE_PLUGIN_SHA::7}\` applied only to \`vendroid-browser.*\`).

          ### Quick Install
          - **VendroidEnhanced** (*Developer settings → Vencord location*):
            \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/browser.js\`
          - **Chromium / Titanium / PC Chrome** (clean Vencord): \`extension-chrome.zip\`
          - **Firefox / Mobile Firefox** (clean Vencord): \`extension-firefox.zip\`
          - **Userscript (Violentmonkey / Tampermonkey)** (clean Vencord): \`Vencord.user.js\` or auto-update URL \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/Vencord.user.js\`

          ### SHA-256
          \`\`\`
          $(cat "$DIST/SHA256SUMS.txt")
          \`\`\`
          NOTES

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
            else
              gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file /tmp/release-notes.md
            fi
          elif [ "${GITHUB_REF}" = "refs/heads/dev" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git tag -f nightly "$GITHUB_SHA"
            git push -f origin refs/tags/nightly
            TITLE="Nightly (${GITHUB_REF_NAME}@${GITHUB_SHA::7})"
            if gh release view nightly >/dev/null 2>&1; then
              for old in browser.js browser.css browser.js.LEGAL.txt; do
                gh release delete-asset nightly "$old" -y 2>/dev/null || true
              done
              gh release upload nightly "${ASSETS[@]}" --clobber
              gh release edit nightly --title "$TITLE" --notes-file /tmp/release-notes.md --prerelease
            else
              gh release create nightly "${ASSETS[@]}" --title "$TITLE" --notes-file /tmp/release-notes.md --prerelease
            fi
          fi
